<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0B0F19"/>
  <!-- Subtle gradient overlay -->
  <rect width="512" height="512" rx="110" fill="url(#g2)"/>

  <!-- R letterform -->
  <!-- Vertical stem -->
  <rect x="128" y="110" width="72" height="292" rx="8" fill="url(#g1)"/>
  <!-- Top bowl top horizontal -->
  <rect x="128" y="110" width="210" height="68" rx="34" fill="url(#g1)"/>
  <!-- Mid bowl connector -->
  <rect x="128" y="218" width="200" height="64" rx="32" fill="url(#g1)"/>
  <!-- Right bowl side (circle cap) -->
  <rect x="290" y="110" width="72" height="176" rx="36" fill="url(#g1)"/>

  <!-- R leg (diagonal going bottom-right with arrow tip) -->
  <rect x="200" y="278" width="72" height="124" rx="8" transform="rotate(28 236 340)" fill="url(#g1)"/>

  <!-- Arrow tip on leg -->
  <polygon points="340,402 384,358 384,402" fill="#10B981" opacity="0.9"/>
</svg>
